name: Release and Publish

on:
  push:
    tags:
      - "v*"
      - "slider-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create GitHub releases
      id-token: write # OIDC for npm publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Determine release type
        id: release
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if [[ $TAG == slider-v* ]]; then
            echo "type=slider" >> $GITHUB_OUTPUT
            echo "version=${TAG#slider-v}" >> $GITHUB_OUTPUT
          else
            echo "type=template" >> $GITHUB_OUTPUT
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      # Build packages first (needed for workspace resolution)
      - name: Build local packages
        run: |
          cd packages/validations && pnpm install && pnpm build
          cd ../slider && pnpm install && pnpm build

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Build and verify template (for v* tags)
      - name: Build template
        if: steps.release.outputs.type == 'template'
        run: pnpm build

      # Publish CLI to npm (for v* tags)
      - name: Publish CLI to npm
        if: steps.release.outputs.type == 'template'
        run: |
          cd cli
          npm version ${{ steps.release.outputs.version }} --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Build slider package (for slider-v* tags)
      - name: Build and publish slider
        if: steps.release.outputs.type == 'slider'
        run: |
          cd packages/slider
          npm version ${{ steps.release.outputs.version }} --no-git-tag-version
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create GitHub Release for Template
      - name: Create GitHub Release (Template)
        if: steps.release.outputs.type == 'template'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: Release v${{ steps.release.outputs.version }}
          body: |
            ## 🚀 AtomicTemplate v${{ steps.release.outputs.version }}

            ### Installation
            ```bash
            npx create-atomictemplate my-project
            cd my-project
            pnpm install
            pnpm dev
            ```

            ### Documentation
            - 📚 [Full Documentation](https://github.com/nomanjawad/atomictemplate#readme)
            - 🎯 [Quick Start Guide](https://github.com/nomanjawad/atomictemplate/blob/main/docs/01-getting-started/quick-start.md)

            ### What's New
            See [CHANGELOG.md](https://github.com/nomanjawad/atomictemplate/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create GitHub Release for Slider
      - name: Create GitHub Release (Slider)
        if: steps.release.outputs.type == 'slider'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: slider-v${{ steps.release.outputs.version }}
          name: "@atomictemplate/slider v${{ steps.release.outputs.version }}"
          body: |
            ## 🎠 @atomictemplate/slider v${{ steps.release.outputs.version }}

            ### Installation
            ```bash
            npm install @atomictemplate/slider gsap
            # or
            pnpm add @atomictemplate/slider gsap
            ```

            ### Features
            - ✅ GSAP-powered animations
            - ✅ Lazy loading with IntersectionObserver
            - ✅ Full keyboard navigation
            - ✅ ARIA accessibility
            - ✅ Touch/swipe support
            - ✅ Marquee mode
            - ✅ Responsive breakpoints

            ### Documentation
            - 📚 [Slider Documentation](https://github.com/nomanjawad/atomictemplate/tree/main/packages/slider#readme)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
